name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --verbosity normal

      - name: Publish (win-x64)
        run: dotnet publish src/Ahir.CLI/Ahir.CLI.csproj -c Release -o publish/win-x64 --runtime win-x64 --self-contained

      - name: Publish (linux-x64)
        run: dotnet publish src/Ahir.CLI/Ahir.CLI.csproj -c Release -o publish/linux-x64 --runtime linux-x64 --self-contained

      - name: Publish (osx-x64)
        run: dotnet publish src/Ahir.CLI/Ahir.CLI.csproj -c Release -o publish/osx-x64 --runtime osx-x64 --self-contained

      - name: Publish Installer
        run: dotnet publish tools/Steps/Steps.csproj -c Release -o publish/installer --runtime win-x64 --self-contained

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/**
            publish/linux-x64/**
            publish/osx-x64/**
            publish/installer/**
          generate_release_notes: true
